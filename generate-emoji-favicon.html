<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Emoji Favicon</title>
</head>
<body>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas32" width="32" height="32"></canvas>
    <canvas id="canvas180" width="180" height="180"></canvas>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>
    
    <script>
        const emoji = '😋'; // Yummy smile emoji
        
        function drawEmoji(canvas, size) {
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.font = `${size * 0.75}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, size / 2, size / 2);
        }
        
        drawEmoji(document.getElementById('canvas16'), 16);
        drawEmoji(document.getElementById('canvas32'), 32);
        drawEmoji(document.getElementById('canvas180'), 180);
        drawEmoji(document.getElementById('canvas192'), 192);
        drawEmoji(document.getElementById('canvas512'), 512);
        
        // Download links
        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        setTimeout(() => {
            downloadCanvas('canvas16', 'favicon-16x16.png');
        }, 100);
        setTimeout(() => {
            downloadCanvas('canvas32', 'favicon-32x32.png');
        }, 200);
        setTimeout(() => {
            downloadCanvas('canvas180', 'apple-touch-icon.png');
        }, 300);
        setTimeout(() => {
            downloadCanvas('canvas192', 'android-chrome-192x192.png');
        }, 400);
        setTimeout(() => {
            downloadCanvas('canvas512', 'android-chrome-512x512.png');
        }, 500);
    </script>
</body>
</html>
